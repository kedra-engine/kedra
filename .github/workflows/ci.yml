name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Select checks by changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.rust }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.python }}
      markdown: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.markdown }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.workflows }}
      distribution: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          # Git discovery avoids the PR REST endpoint's 3,000-file limit.
          token: ''
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml

  policy:
    name: Policy and workflow contracts
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: policy-bootstrap-v2-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: |
            . -> target/xtask-bootstrap
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: File growth
        run: cargo xtask files --non-interactive
      - name: Dependency architecture
        if: needs.changes.outputs.rust == 'true'
        run: cargo xtask architecture --non-interactive
      - name: Dependency exception policy
        if: needs.changes.outputs.rust == 'true'
        run: cargo xtask dependency-policy --non-interactive
      - name: Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo xtask fmt --non-interactive
      - uses: jdx/mise-action@v5
        if: needs.changes.outputs.workflows == 'true'
        with:
          version: 2026.10.15
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          mise_toml: |
            [tools]
            "aqua:rhysd/actionlint" = "1.7.12"
            "aqua:zizmorcore/zizmor" = "1.31.1"
      - name: Validate workflow syntax and expressions
        if: needs.changes.outputs.workflows == 'true'
        run: actionlint -color
      - name: Audit workflow security
        if: needs.changes.outputs.workflows == 'true'
        run: zizmor --offline --no-progress .github/workflows

  native:
    name: Native (${{ matrix.os }})
    needs: [changes, policy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo-jobs: '4'
          - os: windows-2025
            cargo-jobs: '2'
          - os: macos-15
            cargo-jobs: '4'
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo-jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev pax-utils
      - name: Use the MSVC-compatible C++ driver on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CXX=clang-cl" >> $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-lean-v2-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: |
            . -> target
            . -> target/xtask-bootstrap
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Windows diagnostic wrapper regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/ci/test-windows-build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native lint
        run: cargo xtask lint --non-interactive
      - name: Native unit, integration and documentation tests
        if: runner.os != 'Linux'
        run: cargo xtask test --non-interactive
      - name: Linux documentation tests (workspace tests run in coverage)
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --all-features --locked
      - name: API documentation
        if: runner.os == 'Linux'
        run: cargo xtask doc --non-interactive
      - name: Default, minimal and isolated runtime features
        run: cargo xtask features --non-interactive
      - name: Match the release job's Python environment
        uses: actions/setup-python@v7
        if: runner.os == 'Linux' && needs.changes.outputs.distribution == 'true'
        with:
          python-version: '3.13'
      - name: Real native dependency notices and modified LGPL-library relink
        if: runner.os == 'Linux' && needs.changes.outputs.distribution == 'true'
        env:
          KEDRA_NATIVE_EVIDENCE: ${{ runner.temp }}/native-runtime-evidence
        run: cargo test -p kedra_build --lib --locked native_distribution -- --ignored --nocapture
      - name: Retain failure and timing diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: |
            target/xtask/logs/*.log
            target/ci/windows-build/**
            target/cargo-timings/*.html
            ${{ runner.temp }}/native-runtime-evidence/*
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Fresh Rust line coverage
    needs: [changes, policy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Pinned Rust and LLVM tooling
        run: rustup component add llvm-tools-preview
      - name: Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.7.1
          checksum: true
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-llvm-cov-0.7.1-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: . -> target/llvm-cov-target
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fresh informational workspace coverage
        run: cargo llvm-cov --workspace --all-targets --all-features --locked --lcov --output-path target/coverage.lcov
      - name: Require generated LCOV after successful coverage
        run: test -s target/coverage.lcov
      - name: Retain LCOV after success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage.lcov
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Dependency advisories, licenses and sources
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
          checksum: true
          fallback: none
      - name: Refresh advisories and audit the locked graph
        run: cargo deny --locked check

  repository:
    name: Documentation site, Markdown and local links
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          mise_toml: |
            [tools]
            "aqua:rvben/rumdl" = "0.3.0"
            "aqua:lycheeverse/lychee" = "0.24.2"
            node = "24.22.1"
            bun = "1.3.13"
      - name: Install locked documentation dependencies without lifecycle scripts
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit documentation dependencies
        working-directory: docs
        run: bun audit
      - name: Build both documentation languages and check page pairs
        working-directory: docs
        run: bun run build
      - name: Built-site links and fragments
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/target/documentation/site" --index-files index.html --no-ignore 'target/documentation/site/**/*.html'
      - name: Markdown
        run: rumdl check .
      - name: Install locked landing dependencies without lifecycle scripts
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit landing dependencies
        working-directory: website
        run: bun audit
      - name: Landing build and configuration contracts
        working-directory: website
        run: bun run test
      - name: Build the separate project landing
        working-directory: website
        env:
          KEDRA_DOCS_URL: https://docs.kedra.tech/
        run: bun run build
      - name: Landing links and assets
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/target/website/site" --index-files index.html --no-ignore 'target/website/site/**/*.html'
      - name: Offline links and fragments
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/docs/site" './*.md' docs
      - name: Retain documentation preview after successful validation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: target/documentation/site/
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Source and history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          mise_toml: |
            [tools]
            "aqua:gitleaks/gitleaks" = "8.24.2"
      - name: Secret detector policy regression
        run: python3 tools/security/check_gitleaks.py --gitleaks gitleaks
      - name: History
        run: gitleaks git --redact --no-banner .

  python-test:
    name: Workflow and distribution tooling contracts
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Required gate failure paths
        run: python3 -m unittest discover -s tools/ci -p 'test*.py'
      - name: Distribution tool failure paths
        run: python3 -m unittest discover -s tools/distribution -p 'test*.py'

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, policy, native, coverage, supply-chain, repository, secrets, python-test, sites-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Require selected checks and verify intentional skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -I tools/ci/required.py

  sites-build:
    name: Build and validate complete public sites
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the checked-out source revision
        id: source
        run: |
          source=$(git rev-parse HEAD)
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          echo "Building and validating public sites from revision $source"
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          mise_toml: |
            [tools]
            node = "24.22.1"
            bun = "1.3.13"
            "aqua:lycheeverse/lychee" = "0.24.2"
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Native prerequisites for the complete Rust API reference
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: public-docs-v1-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: . -> target/documentation/cargo
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
      - name: Install and audit locked documentation dependencies
        working-directory: docs
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun audit
      - name: Build English/Russian documentation and the complete Rust API reference
        working-directory: docs
        run: bun run build:api
      - name: Check generated documentation, assets and fragments
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/target/documentation/site" --index-files index.html --no-ignore 'target/documentation/site/**/*.html'
      - name: Install and audit locked landing dependencies
        working-directory: website
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun audit
      - name: Landing build contracts
        working-directory: website
        run: bun run test
      - name: Build the separate landing with public documentation links
        working-directory: website
        env:
          KEDRA_DOCS_URL: https://docs.kedra.tech/
        run: bun run build
      - name: Check landing links and assets
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/target/website/site" --index-files index.html --no-ignore 'target/website/site/**/*.html'
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: public-documentation
          path: target/documentation/site/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: public-landing
          path: target/website/site/
          if-no-files-found: error
          retention-days: 7

  sites-deploy:
    name: Publish public sites
    needs: [required, sites-build]
    if: >-
      needs.required.result == 'success' &&
      needs.sites-build.result == 'success' &&
      github.repository == 'kedra-engine/kedra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: public-static-sites-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: sites-production
      url: https://kedra.tech/
    steps:
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          mise_toml: |
            [tools]
            awscli = "2.34.0"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: public-documentation
          path: staging/documentation
      - uses: actions/download-artifact@v8.0.2
        with:
          name: public-landing
          path: staging/landing
      - name: Verify deployment inputs and reject a superseded revision
        env:
          SOURCE_SHA: ${{ needs.sites-build.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/kedra-engine/kedra/commits/main --jq .sha)
          test "$SOURCE_SHA" = "$current"
          test -s staging/landing/index.html
          test -s staging/landing/ru/index.html
          test -s staging/landing/licenses/Inter-OFL.txt
          test -s staging/documentation/en/index.html
          test -s staging/documentation/ru/index.html
          test -s staging/documentation/api/index.html
          test -s staging/documentation/third-party-notices.txt
          test -z "$(find staging -type l -print -quit)"
      - name: Publish both dedicated static-site buckets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_SITES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SITES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          aws --version
          echo 'Publishing kedra.tech'
          aws --endpoint-url https://storage.yandexcloud.net s3 sync staging/landing/ s3://kedra.tech/ --delete --cache-control no-cache --no-progress --no-follow-symlinks
          echo 'Publishing docs.kedra.tech, including the Rust API reference'
          aws --endpoint-url https://storage.yandexcloud.net s3 sync staging/documentation/ s3://docs.kedra.tech/ --delete --cache-control no-cache --no-progress --no-follow-symlinks
          echo 'PASS: both static-site uploads completed'
