name: Crates.io publication

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact current main commit with successful push CI
        required: true
        type: string
      publish:
        description: Publish all Cargo-admitted workspace libraries permanently to crates.io
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  verify:
    name: Verify crate archives (${{ matrix.os }})
    if: github.repository == 'kedra-engine/kedra' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/crates-publication
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require clean current main, successful push CI and publication metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: python3 tools/ci/crates.py preflight --source "$RELEASE_SOURCE"
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: crates-publication-v1-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: . -> target/crates-publication
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
      - name: Cargo packages and compiles every admitted crate without registry credentials
        run: cargo publish --workspace --registry crates-io --dry-run --locked --all-features
      - name: Materialize Cargo archives after successful compilation
        run: python3 tools/ci/crates.py materialize --target-dir "$CARGO_TARGET_DIR"
      - name: Verify actual archive identity and both canonical license texts
        run: python3 tools/ci/crates.py archives --directory "$CARGO_TARGET_DIR/package"
      - name: Retain verified archive evidence
        uses: actions/upload-artifact@v7
        with:
          name: crates-${{ runner.os }}
          path: target/crates-publication/package/*.crate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified crates
    if: inputs.publish && github.repository == 'kedra-engine/kedra' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Recheck source freshness, CI and legal-content admission immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: python3 tools/ci/crates.py preflight --source "$RELEASE_SOURCE"
      - name: Publish the same immutable source already compiled by the current-run matrix
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # First registration uses the owner's bootstrap token; see docs/crates-publication.md.
        run: | # zizmor: ignore[use-trusted-publishing]
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --workspace --registry crates-io --locked --all-features --no-verify
          echo 'PASS: Cargo completed crates.io publication'
