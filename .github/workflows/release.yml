name: Desktop distribution

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed main commit with successful CI
        required: true
        type: string
      tag:
        description: New Cargo-matching release tag (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish complete validated artifacts as an unsigned prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-distribution
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Source identity, main ancestry, genuine CI and new release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/ci/release.py --source "$RELEASE_SOURCE" --tag "$RELEASE_TAG"

  package:
    name: Package (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            jobs: '1'
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            jobs: '4'
          - os: macos-15
            target: aarch64-apple-darwin
            jobs: '4'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            jobs: '4'
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      RELEASE_SOURCE: ${{ needs.preflight.outputs.source }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native Rust toolchain and PE inspection tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - name: Linux native packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev libfuse2t64 patchelf file binutils
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ runner.os }}-${{ runner.arch }}
          env-vars: ImageOS ImageVersion
          workspaces: |
            . -> target
            . -> target/kedra-build-bootstrap
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
          checksum: true
          fallback: none
      - name: Audit immutable application dependency graph
        run: cargo deny --locked check
      - name: Isolated audited license collector (no project dependency downgrades)
        run: python3 tools/distribution/install_about.py --output "$RUNNER_TEMP/cargo-about"
      - name: Same shared native packaging command for every application
        run: cargo kedra package --package kedra --target "$RELEASE_TARGET" --output target/release-package
      - name: Inspect actual installer/archive and installed executable
        run: python3 tools/distribution/inspect_package.py target/release-package --target "$RELEASE_TARGET" --source "$RELEASE_SOURCE" --version "${RELEASE_TAG#v}"
      - name: Independent pinned public Git consumer and unchanged project aliases
        run: python3 tools/distribution/validate_fixture.py --revision "$RELEASE_SOURCE" --package
      - name: Retain only validated release files
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            target/release-package/*.exe
            target/release-package/*.zip
            target/release-package/*.AppImage
            target/release-package/*.tar.gz
            target/release-package/*.dmg
            target/release-package/artifact-inventory.json
            target/release-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Bounded failure diagnostics and isolated tool lock evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: distribution-diagnostics-${{ matrix.target }}
          path: |
            target/xtask/logs/*.log
            target/release-package/packages/native-config.json
            target/release-package/packages/native-output.json
            ${{ runner.temp }}/cargo-about/source/cargo-about-0.9.2/Cargo.lock
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish complete prerelease
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      RELEASE_SOURCE: ${{ needs.preflight.outputs.source }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download validated packages from this run only
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: ${{ runner.temp }}/incoming-packages
      - name: Load only the narrow publisher from this immutable main workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release-policy"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/tools/ci/release.py?ref=$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/release-policy/release.py"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/tools/ci/release_artifacts.py?ref=$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/release-policy/release_artifacts.py"
      - name: Revalidate source, matrix, package hashes and draft uploads before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-policy/release.py" --source "$RELEASE_SOURCE" --tag "$RELEASE_TAG" --publish-directory "$RUNNER_TEMP/incoming-packages"
