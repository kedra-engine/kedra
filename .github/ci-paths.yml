# Maintained dorny/paths-filter owns matching and change discovery. Unknown inputs
# trigger Rust checks; only known documentation/Python/workflow-only paths opt out.
rust:
  - '**'
  - '!*.md'
  - '!docs/**/*.md'
  - '!tools/**/*.py'
  - '!.github/**'
  - '!.rumdl.toml'
  - '!lychee.toml'
  - '!docs/.vitepress/**'
  - '!docs/site/**'
  - '!docs/scripts/**'
  - '!docs/package.json'
  - '!docs/bun.lock'
  - '!docs/bunfig.toml'
  - '!docs/.node-version'
python:
  - 'tools/**/*.py'
  - '.github/**'
markdown:
  - '**/*.md'
  - 'docs/**'
  - '.rumdl.toml'
  - 'lychee.toml'
  - '.github/**'
  - 'website/**'
  - 'assets/editor/fonts/**'
  - 'LICENSE-MIT'
  - 'LICENSE-APACHE'
workflows:
  - '.github/**'
distribution:
  - 'crates/kedra_build/**'
  - 'tools/distribution/**'
  - 'tools/kedra/**'
  - 'tests/fixtures/distribution/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - '.cargo/**'
