[graph]
all-features = true

[advisories]
version = 2
# Upstream Wayland caption fonts, not our delivered UI font pipeline. No patched
# version exists. The policy regression pins its existing direct wrapper and
# enforces review by 2026-12-26; future vulnerability IDs still fail. See
# docs/decisions/0007-dependency-policy.md for reachability and review/removal.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained-only advisory in Winit's Linux CSD stack; no patched release. Exact reachability and review deadline enforced by xtask policy tests; see ADR 0007." },
]

[licenses]
version = 2
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]

# Owner-approved CSS stack. MPL is file-level copyleft, not a project-wide
# license change. Preserve notices and provide the exact covered sources when
# distributing binaries; see docs/third-party.md. Keep upgrades reviewable.
[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-color"
version = "=0.5.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

# Non-CSS transitive utilities: formatted CLI diagnostics and home-directory
# discovery. Same file-level source/notice obligations; no blanket MPL allowance.
[[licenses.exceptions]]
name = "colored"
version = "=2.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Reviewed incompatible release lines, not entire dependency subtrees. Every
# lower line is exact-pinned here; a new duplicate version still fails. Reasons
# and immediate upstream consumers: docs/decisions/0007-dependency-policy.md.
skip = [
    { name = "bitflags", version = "=1.3.2" },
    { name = "block2", version = "=0.5.1" },
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "downcast-rs", version = "=1.2.1" },
    { name = "foldhash", version = "=0.1.5" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.16.1" },
    { name = "itertools", version = "=0.14.0" },
    { name = "jni", version = "=0.21.1" },
    { name = "jni-sys", version = "=0.3.1" },
    { name = "linux-raw-sys", version = "=0.4.15" },
    { name = "miniz_oxide", version = "=0.8.9" },
    { name = "objc2", version = "=0.5.3" },
    { name = "objc2-app-kit", version = "=0.2.2" },
    { name = "objc2-foundation", version = "=0.2.2" },
    { name = "r-efi", version = "=5.3.0" },
    { name = "redox_syscall", version = "=0.4.1" },
    { name = "redox_syscall", version = "=0.5.18" },
    { name = "rustc-hash", version = "=1.1.0" },
    { name = "rustix", version = "=0.38.44" },
    { name = "syn", version = "=2.0.119" },
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    { name = "tiny-skia", version = "=0.11.4" },
    { name = "tiny-skia-path", version = "=0.11.4" },
    { name = "windows-sys", version = "=0.45.0" },
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-targets", version = "=0.42.2" },
    { name = "windows_aarch64_gnullvm", version = "=0.42.2" },
    { name = "windows_aarch64_msvc", version = "=0.42.2" },
    { name = "windows_i686_gnu", version = "=0.42.2" },
    { name = "windows_i686_msvc", version = "=0.42.2" },
    { name = "windows_x86_64_gnu", version = "=0.42.2" },
    { name = "windows_x86_64_gnullvm", version = "=0.42.2" },
    { name = "windows_x86_64_msvc", version = "=0.42.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
