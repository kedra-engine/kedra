[package]
name = "kedra_build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared application build, verified resources and native distribution tooling"
publish = false

[package.metadata.kedra]
layer = "tooling"

[dependencies]
cargo-packager.workspace = true
cargo_metadata = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
kedra_assets.workspace = true
kedra_import.workspace = true
image = { workspace = true, features = ["ico"] }
tauri-icns = "=0.1.0"
tempfile.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
walkdir = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
cargo-lock = { version = "=11.1.0", default-features = false }
handlebars = "=6.4.4"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std"] }

[dev-dependencies]
object = { version = "=0.40.0", default-features = false, features = ["write"] }

[lints]
workspace = true
