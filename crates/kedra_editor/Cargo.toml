[package]
name = "kedra_editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Project lifecycle and retained dockable native editor workspace"

[package.metadata.kedra]
layer = "editor"

[dependencies]
bevy = { workspace = true, features = ["bevy_state", "multi_threaded", "ui_bevy_render", "ui_picking", "png", "bevy_pbr", "bevy_gltf", "pan_orbit_camera", "render_dev_tools", "mesh_picking", "bevy_gizmos_render"] }
kedra_project.workspace = true
kedra_update.workspace = true
kedra_desktop.workspace = true
kedra_assets = { workspace = true, features = ["model-support"] }
serde_json.workspace = true
serde.workspace = true
serde_with.workspace = true
uuid.workspace = true
bevy_remote.workspace = true
kedra_app.workspace = true
kedra_ui = { workspace = true, features = ["system-fonts"] }
kedra_inspector.workspace = true
kedra_scene = { workspace = true, features = ["render"] }
kedra_docking.workspace = true
kedra_authoring.workspace = true
ron.workspace = true
walkdir = "2"
unicase = "=2.9.0"
bevy_flair.workspace = true
directories = "6"
tempfile.workspace = true
sha2.workspace = true
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[dev-dependencies]
image.workspace = true

[features]
# Native opt-in acceptance host; does not install EditorPlugin or project startup.
docking-fixture = []

[[example]]
name = "docking_fixture"
required-features = ["docking-fixture"]

[lints]
workspace = true
