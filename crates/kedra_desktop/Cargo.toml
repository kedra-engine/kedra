[package]
name = "kedra_desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owned native window surfaces for the Kedra editor"

[package.metadata.kedra]
layer = "editor"

[dependencies]
bevy = { workspace = true, features = ["bevy_winit", "bevy_core_pipeline", "bevy_ui", "bevy_input_focus", "custom_cursor"] }
kedra_ui.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[lints]
workspace = true
