[package]
name = "kedra_update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded release discovery, verified packages and explicit native update installation"

[package.metadata.kedra]
layer = "runtime"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
semver = "1"
url = { version = "2", features = ["serde"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
self_update = { version = "=1.3.1", default-features = false, features = ["ureq", "rustls", "native-certs"] }
plist = "1"
object = { version = "=0.40.0", default-features = false, features = ["read_core", "macho", "std"] }
walkdir = "2"

[lints]
workspace = true
