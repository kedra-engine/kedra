[workspace]
members = ["xtask", "apps/kedra", "tools/kedra", "tools/test", "crates/*"]
exclude = ["tests/fixtures/test_project"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kedra-engine/kedra"
homepage = "https://kedra.tech/"

[workspace.dependencies]
kedra_gizmo = { path = "crates/kedra_gizmo", version = "=0.1.3" }
kedra_cache = { path = "crates/kedra_cache", version = "=0.1.3" }
cargo-packager = { version = "=0.11.8", git = "https://github.com/crabnebula-dev/cargo-packager.git", rev = "5c1824ba8022401e9ef0de36ff1a12c5acf60237", default-features = false, features = ["rustls-tls", "platform-certs"] }
kedra_build = { path = "crates/kedra_build", version = "=0.1.3" }
kedra_test = { path = "crates/kedra_test", version = "=0.1.3" }
kedra_script = { path = "crates/kedra_script", version = "=0.1.3" }
kedra_script_bevy = { path = "crates/kedra_script_bevy", version = "=0.1.3" }
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
kedra_project = { path = "crates/kedra_project", version = "=0.1.3" }
kedra_desktop = { path = "crates/kedra_desktop", version = "=0.1.3" }
kedra_editor = { path = "crates/kedra_editor", version = "=0.1.3" }
kedra_update = { path = "crates/kedra_update", version = "=0.1.3" }
kedra_assets = { path = "crates/kedra_assets", version = "=0.1.3" }
kedra_import = { path = "crates/kedra_import", version = "=0.1.3" }
kedra_ui = { path = "crates/kedra_ui", version = "=0.1.3" }
kedra_text_input = { path = "crates/kedra_text_input", version = "=0.1.3" }
kedra_inspector = { path = "crates/kedra_inspector", version = "=0.1.3" }
kedra_inspector_luau = { path = "crates/kedra_inspector_luau", version = "=0.1.3" }
kedra_app = { path = "crates/kedra_app", version = "=0.1.3" }
kedra_scene = { path = "crates/kedra_scene", version = "=0.1.3" }
kedra_authoring = { path = "crates/kedra_authoring", version = "=0.1.3" }
kedra_authoring_fs = { path = "crates/kedra_authoring_fs", version = "=0.1.3" }
kedra_authoring_assets = { path = "crates/kedra_authoring_assets", version = "=0.1.3" }
kedra_preview = { path = "crates/kedra_preview", version = "=0.1.3" }
kedra_editor_context = { path = "crates/kedra_editor_context", version = "=0.1.3" }
kedra_authoring_luau = { path = "crates/kedra_authoring_luau", version = "=0.1.3" }
kedra_docking = { path = "crates/kedra_docking", version = "=0.1.3" }
kedra_profiling = { path = "crates/kedra_profiling", version = "=0.1.3" }
kedra_wakeup = { path = "crates/kedra_wakeup", version = "=0.1.3" }
bevy_remote = { version = "=0.20.0", default-features = false }
bevy_flair = { version = "=0.9.0", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }
ron = "=0.12.2"
serde_json = "1"
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_with = { version = "=3.24.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Keep the native UI usable during development; unoptimized ECS/text/clipping
# costs are not representative of the application's interaction budget.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Bevy's release-mode recommendations: trade compilation time for runtime speed.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

# Exercise the shipping capability boundary with development optimization, not LTO.
[profile.release-boundary]
inherits = "dev"
debug-assertions = false
debug = 0

# ADR 0020: AppKit must not steal client drags in the transparent titlebar.
[patch.crates-io]
# ADR 0043: keep Flair's path-linked family on one reviewed Git source.
bevy_flair = { git = "https://github.com/kedra-engine/bevy_flair.git", rev = "9be09fb26caa0787afdb63617a82d62eaae0ab00" }
bevy_flair_core = { git = "https://github.com/kedra-engine/bevy_flair.git", rev = "9be09fb26caa0787afdb63617a82d62eaae0ab00" }
bevy_flair_core_macros = { git = "https://github.com/kedra-engine/bevy_flair.git", rev = "9be09fb26caa0787afdb63617a82d62eaae0ab00" }
bevy_flair_style = { git = "https://github.com/kedra-engine/bevy_flair.git", rev = "9be09fb26caa0787afdb63617a82d62eaae0ab00" }
bevy_flair_css_parser = { git = "https://github.com/kedra-engine/bevy_flair.git", rev = "9be09fb26caa0787afdb63617a82d62eaae0ab00" }
winit = { git = "https://github.com/kedra-engine/winit.git", rev = "948d27f0007602d2536a8974fd483c6fd33d19d3" }
