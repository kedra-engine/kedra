[package]
name = "kedra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.kedra]
layer = "tooling"

[dependencies]
bevy = { workspace = true, features = ["async_executor", "bevy_log", "bevy_clipboard", "multi_threaded", "custom_cursor", "x11", "wayland"] }
kedra_editor.workspace = true
kedra_import.workspace = true
kedra_assets.workspace = true
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
