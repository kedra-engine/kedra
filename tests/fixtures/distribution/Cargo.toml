[package]
name = "distribution-fixture"
version = "1.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["tools/kedra"]
default-members = ["."]

[workspace.lints.rust]
unsafe_code = "forbid"

[package.metadata.kedra]
layer = "runtime"

[package.metadata.packager]
productName = "Independent Distribution Fixture"
identifier = "dev.kedra.independent-distribution-fixture"
description = "Headless acceptance fixture, not a game runtime"

[package.metadata.packager.macos]
minimumSystemVersion = "15.0"

[package.metadata.kedra.distribution]
assets = "assets"
profile = "game-desktop"
namespace = "game"
icon = "icon.svg"
notices = ["NOTICE.txt"]
license-config = "about.toml"

[dependencies]
kedra_assets = "=0.1.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[lints]
workspace = true
