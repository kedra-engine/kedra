[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.kedra]
layer = "tooling"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
console = "0.16"
duct = { version = "1.1.2", default-features = false }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image.workspace = true
# image's decoder does not expose all PNG color/HDR metadata for policy validation.
png = "=0.18.1"
# Reuse the released perceptual comparator; scenario policy stays in xtask.
dify = { version = "=0.8.0", default-features = false }

[dev-dependencies]
# Resolve dependency identities from Cargo.lock without downloading foreign-target
# manifests or parsing Cargo's dependency-string grammar ourselves.
cargo-lock = { version = "=11.1.0", default-features = false }

[lints]
workspace = true
