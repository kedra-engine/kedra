title = "Kedra: default detectors with reviewed non-secret Figma provenance"

[extend]
useDefault = true

# Owner-reviewed design identities, not authentication credentials. See docs/testing.md.
# Each table requires BOTH its exact repository-relative path AND one exact match.
# Match targeting binds the field spelling to its own value; line targeting could
# accidentally suppress a different credential on the same line. No detector changes.
# Gitleaks does not parse JSON ancestry: these are field matches, not JSON pointers.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Figma provenance: button-disabled"
condition = "AND"
paths = ['''^docs/ui/corpus/text/button-disabled\.json$''']
regexTarget = "match"
regexes = ['''^file_key": "2EZlK40cfx2Mub7GmDyI70"$''', '''^key": "9709088ed118e80bbf18e7561b188b3ad42d5a29"$''']

